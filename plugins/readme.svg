<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210" role="img" aria-label="Ege Pekkolay — design, developer, software">
  <title>Ege Pekkolay — design → developer → software</title>

  <defs>
    <style><![CDATA[
      .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }

      .sweep { animation: sweep 5.5s linear infinite; }
      @keyframes sweep { from { transform: translateX(-180px) } to { transform: translateX(1000px) } }

      .scan  { animation: scan 9s linear infinite; }
      @keyframes scan { from { transform: translateY(-90px) } to { transform: translateY(215px) } }

      .drift { animation: drift 14s ease-in-out infinite alternate; }
      @keyframes drift { from { opacity: .3 } to { opacity: .6 } }

      @media (prefers-reduced-motion: reduce) {
        .sweep, .drift { animation: none !important }
        .scan { animation: none !important; opacity: 0 }
      }
    ]]></style>

    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00E5A0" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#00E5A0" stop-opacity="1"/>
      <stop offset="70%"  stop-color="#6D9BFF" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#6D9BFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#00E5A0" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#00E5A0" stop-opacity=".055"/>
      <stop offset="100%" stop-color="#00E5A0" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="60%"  stop-color="#DDE7F2"/>
      <stop offset="100%" stop-color="#93A9C2"/>
    </linearGradient>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0 L0 0 0 28" fill="none" stroke="#141B29" stroke-width="1"/>
    </pattern>

    <radialGradient id="glow" cx="16%" cy="72%" r="72%">
      <stop offset="0%"   stop-color="#00E5A0" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#00E5A0" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="panelClip">
      <rect x="1" y="1" width="998" height="208" rx="12"/>
    </clipPath>

   
    <clipPath id="typeClip">
      <rect x="34" y="62" height="34" width="182">
        <animate attributeName="width"
                 values="0;0;182;182;182" keyTimes="0;0.05;0.40;0.95;1"
                 dur="6.5s" repeatCount="indefinite" calcMode="linear"/>
      </rect>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="998" height="208" rx="12" fill="#08090D"/>

  <g clip-path="url(#panelClip)">
    <rect x="0" y="0" width="1000" height="210" fill="url(#grid)" class="drift"/>
    <rect x="0" y="0" width="1000" height="210" fill="url(#glow)"/>
    <rect x="0" y="0" width="1000" height="90" fill="url(#scanGrad)" class="scan"/>
    <rect x="0" y="0" width="1000" height="1.5" fill="#161D2B"/>
    <rect x="0" y="0" width="180" height="1.5" fill="url(#sweepGrad)" class="sweep"/>
  </g>

  <rect x="1" y="1" width="998" height="208" rx="12" fill="none" stroke="#1B2434" stroke-width="1.5"/>

  <!-- terminal chrome -->
  <circle cx="34" cy="30" r="4.5" fill="#2A3345"/>
  <circle cx="52" cy="30" r="4.5" fill="#2A3345"/>
  <circle cx="70" cy="30" r="4.5" fill="#2A3345"/>

  <!-- prompt, typed on a loop -->
  <g clip-path="url(#typeClip)">
    <text x="34" y="86" class="mono" font-size="14.5" letter-spacing="1.2">
      <tspan fill="#3E4C63">ege@app</tspan><tspan fill="#2E3A4D">:~$ </tspan><tspan fill="#ff5f1f">whoege</tspan>
    </text>
  </g>

  <!-- cursor tracks the typing, then blinks at rest -->
  <rect x="34" y="74" width="8" height="15" fill="#00E5A0" opacity=".9">
    <animate attributeName="x" values="34;34;216;216;216" keyTimes="0;0.05;0.40;0.95;1"
             dur="6.5s" repeatCount="indefinite" calcMode="linear"/>
    <animate attributeName="opacity" values="1;1;1;0;1;0;1;0;1;1"
             keyTimes="0;0.05;0.42;0.5;0.58;0.66;0.74;0.82;0.9;1"
             dur="6.5s" repeatCount="indefinite" calcMode="discrete"/>
  </rect>

  <text x="33" y="142" class="mono" font-size="42" font-weight="600"
        letter-spacing="9" fill="url(#nameGrad)">Ege Pekkolay</text>

  <text x="35" y="176" class="mono" font-size="13.5" letter-spacing="3.4" fill="#69788F">
    design<tspan fill="#33404F"> → </tspan>developer<tspan fill="#33404F"> → </tspan>software
  </text>

  <text x="966" y="176" class="mono" font-size="11.5" letter-spacing="2.6"
        fill="#ff5f1f" text-anchor="end">WEB · DEVOPS · Software Developer</text>
</svg>
